name: Clean standalone Metal probe build output

on:
  push:
    branches:
      - macos-psvr2-timing-diagnostics
    paths:
      - .github/workflows/cleanup-macos-metal-probe-build.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: macos-psvr2-timing-diagnostics
      - name: Remove generated SwiftPM build output
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r --ignore-unmatch tools/macos-metal-latency-probe/.build
          printf '.build/\n' > tools/macos-metal-latency-probe/.gitignore
          git add tools/macos-metal-latency-probe/.gitignore
          git rm .github/workflows/cleanup-macos-metal-probe-build.yml
          git commit -m 'chore: remove generated Metal probe build output'
          git push
