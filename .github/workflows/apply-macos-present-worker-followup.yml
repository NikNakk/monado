name: Apply macOS present worker follow-up

on:
  push:
    branches:
      - macos-psvr2-timing-diagnostics

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: macos-psvr2-timing-diagnostics
      - name: Apply focused compositor follow-up
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/xrt/compositor/main/comp_window_macos.m')
          s = path.read_text()

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              s = s.replace(old, new, 1)

          replace_once(
          '''struct macos_present_job
          {
          \tuint64_t frame_id;
          \tuint64_t enqueue_ns;
          \tuint64_t image_reuse_wait_ns;
          \tuint32_t image_index;
          \tuint64_t timeline_value;
          \tint64_t desired_present_time_ns;
          \tint64_t present_slop_ns;
          \tstruct vk_bundle_queue *present_queue;
          };
          ''',
          '''struct macos_present_job
          {
          \tuint64_t frame_id;
          \tuint64_t enqueue_ns;
          \tuint64_t image_reuse_wait_ns;
          \tuint32_t image_index;
          \tuint64_t timeline_value;
          \tint64_t desired_present_time_ns;
          \tint64_t present_slop_ns;
          \tstruct vk_bundle_queue *present_queue;
          };

          /*
           * Presented callbacks are not guaranteed to arrive promptly during layer/display
           * teardown. Keep the callback-owned trace/feedback state independent of cwm so
           * destroy never has to wait forever merely to prevent a use-after-free.
           */
          struct macos_presented_state
          {
          \tatomic_uint_fast64_t ref_count;
          \tatomic_int_fast64_t latest_observed_present_offset_ns;
          \tatomic_uint_fast64_t present_offset_sample_serial;
          \tFILE *trace_presented;
          };

          static struct macos_presented_state *
          macos_presented_state_create(FILE *trace_presented)
          {
          \tstruct macos_presented_state *state = calloc(1, sizeof(*state));
          \tif (state == NULL) {
          \t\treturn NULL;
          \t}
          \tatomic_init(&state->ref_count, 1);
          \tatomic_init(&state->latest_observed_present_offset_ns, 0);
          \tatomic_init(&state->present_offset_sample_serial, 0);
          \tstate->trace_presented = trace_presented;
          \treturn state;
          }

          static void
          macos_presented_state_retain(struct macos_presented_state *state)
          {
          \tatomic_fetch_add_explicit(&state->ref_count, 1, memory_order_relaxed);
          }

          static void
          macos_presented_state_release(struct macos_presented_state *state)
          {
          \tif (state == NULL) {
          \t\treturn;
          \t}
          \tif (atomic_fetch_sub_explicit(&state->ref_count, 1, memory_order_acq_rel) != 1) {
          \t\treturn;
          \t}
          \tif (state->trace_presented != NULL) {
          \t\tfflush(state->trace_presented);
          \t\tfclose(state->trace_presented);
          \t\tstate->trace_presented = NULL;
          \t}
          \tfree(state);
          }
          ''', 'presented callback state')

          replace_once(
          '''DEBUG_GET_ONCE_BOOL_OPTION(macos_async_present, "XRT_MACOS_ASYNC_PRESENT", false)
          DEBUG_GET_ONCE_BOOL_OPTION(macos_metal_shared_event_wait, "XRT_MACOS_METAL_SHARED_EVENT_WAIT", true)
          ''',
          '''DEBUG_GET_ONCE_BOOL_OPTION(macos_async_present, "XRT_MACOS_ASYNC_PRESENT", false)
          DEBUG_GET_ONCE_BOOL_OPTION(macos_metal_shared_event_wait, "XRT_MACOS_METAL_SHARED_EVENT_WAIT", true)
          DEBUG_GET_ONCE_BOOL_OPTION(macos_present_worker, "XRT_MACOS_PRESENT_WORKER", true)
          ''', 'worker option')

          replace_once(
          '''\tbool present_worker_shutdown;
          \tbool async_present;
          \tuint64_t last_image_acquire_wait_ns;
          ''',
          '''\tbool present_worker_shutdown;
          \tbool async_present;
          \tbool present_worker_enabled;
          \tstruct macos_presented_state *presented_state;
          \tuint64_t last_image_acquire_wait_ns;
          ''', 'worker/state fields')

          replace_once(
          '''\t    "next_drawable_end_ns,metal_commit_ns,worker_delay_ns,drawable_wait_ns,image_index,timeline_value,"
          \t    "queue_depth,shared_event_wait");
          ''',
          '''\t    "next_drawable_end_ns,metal_commit_ns,worker_delay_ns,drawable_wait_ns,image_index,timeline_value,"
          \t    "queue_depth,shared_event_wait,newer_pending,pending_frame_id,pending_timeline_value");
          ''', 'worker trace header')

          replace_once(
          '''\tcwm->trace_present_complete = macos_timing_trace_open_file(
          ''',
          '''\tif (cwm->trace_presented != NULL) {
          \t\tcwm->presented_state = macos_presented_state_create(cwm->trace_presented);
          \t\tif (cwm->presented_state == NULL) {
          \t\t\tfclose(cwm->trace_presented);
          \t\t\tcwm->trace_presented = NULL;
          \t\t}
          \t}
          \tcwm->trace_present_complete = macos_timing_trace_open_file(
          ''', 'presented state creation')

          replace_once(
          '''\tcwm->trace_present_group = dispatch_group_create();
          }

          static void
          macos_timing_trace_close(struct comp_window_macos *cwm)
          {
          ''',
          '''}

          static void
          macos_timing_trace_close(struct comp_window_macos *cwm)
          {
          \tif (cwm->presented_state != NULL) {
          \t\t/* Ownership of trace_presented belongs to the ref-counted callback state. */
          \t\tcwm->trace_presented = NULL;
          \t\tmacos_presented_state_release(cwm->presented_state);
          \t\tcwm->presented_state = NULL;
          \t}
          ''', 'remove infinite presented-handler drain')

          replace_once(
          '''\tuint64_t drawable_wait_ns =
          \t    next_drawable_end_ns > next_drawable_begin_ns ? next_drawable_end_ns - next_drawable_begin_ns : 0;
          \tflockfile(cwm->trace_present_worker);
          \tfprintf(cwm->trace_present_worker,
          \t        "%s,%llu,%llu,%llu,%llu,%llu,%llu,%llu,%llu,%llu,%llu,%u,%llu,%u,%u\\n", event,
          \t        (unsigned long long)job->frame_id, (unsigned long long)event_ns,
          \t        (unsigned long long)job->enqueue_ns, (unsigned long long)handoff_return_ns,
          \t        (unsigned long long)worker_start_ns, (unsigned long long)next_drawable_begin_ns,
          \t        (unsigned long long)next_drawable_end_ns, (unsigned long long)metal_commit_ns,
          \t        (unsigned long long)worker_delay_ns, (unsigned long long)drawable_wait_ns, job->image_index,
          \t        (unsigned long long)job->timeline_value, queue_depth, shared_event_wait ? 1u : 0u);
          ''',
          '''\tuint64_t drawable_wait_ns =
          \t    next_drawable_end_ns > next_drawable_begin_ns ? next_drawable_end_ns - next_drawable_begin_ns : 0;
          \tbool newer_pending = false;
          \tuint64_t pending_frame_id = 0;
          \tuint64_t pending_timeline_value = 0;
          \tif (next_drawable_end_ns != 0 && cwm->present_worker_enabled) {
          \t\tpthread_mutex_lock(&cwm->present_worker_mutex);
          \t\tif (cwm->pending_present_job_valid && cwm->pending_present_job.frame_id > job->frame_id) {
          \t\t\tnewer_pending = true;
          \t\t\tpending_frame_id = cwm->pending_present_job.frame_id;
          \t\t\tpending_timeline_value = cwm->pending_present_job.timeline_value;
          \t\t\tif (queue_depth == 0) {
          \t\t\t\tqueue_depth = 1;
          \t\t\t}
          \t\t}
          \t\tpthread_mutex_unlock(&cwm->present_worker_mutex);
          \t}
          \tflockfile(cwm->trace_present_worker);
          \tfprintf(cwm->trace_present_worker,
          \t        "%s,%llu,%llu,%llu,%llu,%llu,%llu,%llu,%llu,%llu,%llu,%u,%llu,%u,%u,%u,%llu,%llu\\n", event,
          \t        (unsigned long long)job->frame_id, (unsigned long long)event_ns,
          \t        (unsigned long long)job->enqueue_ns, (unsigned long long)handoff_return_ns,
          \t        (unsigned long long)worker_start_ns, (unsigned long long)next_drawable_begin_ns,
          \t        (unsigned long long)next_drawable_end_ns, (unsigned long long)metal_commit_ns,
          \t        (unsigned long long)worker_delay_ns, (unsigned long long)drawable_wait_ns, job->image_index,
          \t        (unsigned long long)job->timeline_value, queue_depth, shared_event_wait ? 1u : 0u,
          \t        newer_pending ? 1u : 0u, (unsigned long long)pending_frame_id,
          \t        (unsigned long long)pending_timeline_value);
          ''', 'worker pending trace')

          replace_once(
          '''\t\tid<CAMetalDrawable> drawable = [cwm->metal_layer nextDrawable];
          \t\tafter_drawable_ns = os_monotonic_get_ns();
          \t\tif (drawable == nil) {
          ''',
          '''\t\tid<CAMetalDrawable> drawable = [cwm->metal_layer nextDrawable];
          \t\tafter_drawable_ns = os_monotonic_get_ns();
          \t\tif (async_present) {
          \t\t\tmacos_trace_present_worker(cwm, "drawable_end", job, after_drawable_ns, 0, worker_start_ns,
          \t\t\t                           next_drawable_begin_ns, after_drawable_ns, 0, 0, shared_event_wait);
          \t\t}
          \t\tif (drawable == nil) {
          ''', 'drawable-end trace')

          replace_once(
          '''\t\tif (cwm->trace_presented != NULL && cwm->trace_present_group != NULL) {
          \t\t\tFILE *trace_file = cwm->trace_presented;
          \t\t\tdispatch_group_t trace_group = cwm->trace_present_group;
          \t\t\tuint64_t traced_frame_id = frame_id;
          \t\t\tint64_t traced_desired_present_ns = desired_present_time_ns;
          \t\t\tuint64_t traced_target_output_ns = target_output_ns;
          \t\t\tdispatch_group_enter(trace_group);
          \t\t\t[drawable addPresentedHandler:^(id<MTLDrawable> presented_drawable) {
          ''',
          '''\t\tif (cwm->presented_state != NULL) {
          \t\t\tstruct macos_presented_state *presented_state = cwm->presented_state;
          \t\t\tmacos_presented_state_retain(presented_state);
          \t\t\tFILE *trace_file = presented_state->trace_presented;
          \t\t\tuint64_t traced_frame_id = frame_id;
          \t\t\tint64_t traced_desired_present_ns = desired_present_time_ns;
          \t\t\tuint64_t traced_target_output_ns = target_output_ns;
          \t\t\t[drawable addPresentedHandler:^(id<MTLDrawable> presented_drawable) {
          ''', 'presented handler independent state')

          replace_once(
          '''\t\t\t\tif (observed_present_offset_ns > 0) {
          \t\t\t\t\tatomic_store_explicit(&cwm->latest_observed_present_offset_ns, observed_present_offset_ns,
          \t\t\t\t\t                      memory_order_release);
          \t\t\t\t\tatomic_fetch_add_explicit(&cwm->present_offset_sample_serial, 1, memory_order_release);
          \t\t\t\t}
          ''',
          '''\t\t\t\tif (observed_present_offset_ns > 0) {
          \t\t\t\t\tatomic_store_explicit(&presented_state->latest_observed_present_offset_ns,
          \t\t\t\t\t                      observed_present_offset_ns, memory_order_release);
          \t\t\t\t\tatomic_fetch_add_explicit(&presented_state->present_offset_sample_serial, 1,
          \t\t\t\t\t                          memory_order_release);
          \t\t\t\t}
          ''', 'presented feedback state')

          replace_once(
          '''\t\t\t\tdispatch_group_leave(trace_group);
          \t\t\t}];
          ''',
          '''\t\t\t\tmacos_presented_state_release(presented_state);
          \t\t\t}];
          ''', 'presented state release')

          replace_once(
          '''\tdispatch_group_enter(cwm->present_command_group);
          \tdispatch_async(cwm->present_worker_queue, ^{
          ''',
          '''\tdispatch_group_enter(cwm->present_command_group);
          \tdispatch_queue_t retirement_queue = cwm->present_worker_queue;
          \tif (retirement_queue == NULL) {
          \t\tretirement_queue = dispatch_get_global_queue(QOS_CLASS_USER_INTERACTIVE, 0);
          \t}
          \tdispatch_async(retirement_queue, ^{
          ''', 'retirement queue fallback')

          replace_once(
          '''\tif (!cwm->async_present) {
          \t\treturn macos_execute_present_job(cwm, &job, false);
          \t}
          \tif (index >= ct->image_count || cwm->metal_images[index] == nil || present_queue == NULL) {
          ''',
          '''\tif (!cwm->async_present) {
          \t\treturn macos_execute_present_job(cwm, &job, false);
          \t}
          \tif (!cwm->present_worker_enabled) {
          \t\t/* Diagnostic A/B: keep async Metal/shared-event handoff but acquire drawable on caller. */
          \t\treturn macos_execute_present_job(cwm, &job, true);
          \t}
          \tif (index >= ct->image_count || cwm->metal_images[index] == nil || present_queue == NULL) {
          ''', 'worker A/B path')

          replace_once(
          '''\tuint64_t present_offset_serial =
          \t    atomic_load_explicit(&cwm->present_offset_sample_serial, memory_order_acquire);
          \tif (present_offset_serial != cwm->consumed_present_offset_sample_serial && cwm->display_period_ns > 0) {
          \t\tint64_t sample_ns =
          \t\t    atomic_load_explicit(&cwm->latest_observed_present_offset_ns, memory_order_acquire);
          ''',
          '''\tuint64_t present_offset_serial = 0;
          \tint64_t sample_ns = 0;
          \tif (cwm->presented_state != NULL) {
          \t\tpresent_offset_serial =
          \t\t    atomic_load_explicit(&cwm->presented_state->present_offset_sample_serial, memory_order_acquire);
          \t\tsample_ns = atomic_load_explicit(&cwm->presented_state->latest_observed_present_offset_ns,
          \t\t                                 memory_order_acquire);
          \t}
          \tif (present_offset_serial != cwm->consumed_present_offset_sample_serial && cwm->display_period_ns > 0) {
          ''', 'presented feedback consumer')

          replace_once(
          '''\tcwm->async_present = debug_get_bool_option_macos_async_present();
          \tcwm->present_command_group = dispatch_group_create();
          \tif (cwm->async_present) {
          ''',
          '''\tcwm->async_present = debug_get_bool_option_macos_async_present();
          \tcwm->present_worker_enabled = cwm->async_present && debug_get_bool_option_macos_present_worker();
          \tcwm->present_command_group = dispatch_group_create();
          \tif (cwm->present_worker_enabled) {
          ''', 'worker creation toggle')

          replace_once(
          '''\t\tCOMP_INFO(ct->c, "%s: average %.3fms, min %.3fms, max %.3fms, late %llu/240",
          \t\t          async_present ? "macOS present-worker completion cadence" : "macOS present-call return cadence",
          ''',
          '''\t\tconst char *cadence_label = cwm->present_worker_enabled
          \t\t                                ? "macOS present-worker completion cadence"
          \t\t                                : (async_present ? "macOS async present completion cadence"
          \t\t                                                 : "macOS present-call return cadence");
          \t\tCOMP_INFO(ct->c, "%s: average %.3fms, min %.3fms, max %.3fms, late %llu/240",
          \t\t          cadence_label,
          ''', 'cadence label')

          path.write_text(s)
          PY
          git diff --check
          git diff -- src/xrt/compositor/main/comp_window_macos.m
      - name: Commit patch and remove staging workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-macos-present-worker-followup.yml
          git add src/xrt/compositor/main/comp_window_macos.m
          git commit -m "diag: add present worker A/B and safe presented callbacks"
          git push origin HEAD:macos-psvr2-timing-diagnostics
