name: One-shot PS Sense IMU candidate diagnostic

on:
  push:
    branches:
      - macos-psvr2-camera-calibration
    paths:
      - .github/workflows/oneshot-pssense-imu-candidate-diag.yml

permissions:
  contents: write

jobs:
  patch-build-and-commit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: macos-psvr2-camera-calibration
          fetch-depth: 0

      - name: Patch candidate IMU residual diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/xrt/drivers/pssense/pssense_driver.c')
          text = path.read_text()

          old_anchor = '''\tos_thread_helper_lock(&pssense->controller_thread);\n\tpssense->tracking.candidate_count++;\n'''
          new_anchor = '''\tos_thread_helper_lock(&pssense->controller_thread);\n\n\t/*\n\t * Diagnostic only: sample the same corrected IMU orientation used by the\n\t * constellation tracking source at this camera exposure timestamp, then\n\t * measure the camera-local optical candidate against it. Do not gate on\n\t * this residual yet.\n\t */\n\tstruct xrt_space_relation imu_orientation_relation = XRT_SPACE_RELATION_ZERO;\n\tpssense_get_constellation_pose(pssense, sample->timestamp_ns, &imu_orientation_relation);\n\tbool have_imu_orientation =\n\t    (imu_orientation_relation.relation_flags &\n\t     (XRT_SPACE_RELATION_ORIENTATION_VALID_BIT | XRT_SPACE_RELATION_ORIENTATION_TRACKED_BIT)) ==\n\t    (XRT_SPACE_RELATION_ORIENTATION_VALID_BIT | XRT_SPACE_RELATION_ORIENTATION_TRACKED_BIT);\n\tfloat imu_delta_deg = NAN;\n\tif (have_imu_orientation) {\n\t\tfloat imu_dot = fabsf(sample->pose.orientation.x * imu_orientation_relation.pose.orientation.x +\n\t\t                      sample->pose.orientation.y * imu_orientation_relation.pose.orientation.y +\n\t\t                      sample->pose.orientation.z * imu_orientation_relation.pose.orientation.z +\n\t\t                      sample->pose.orientation.w * imu_orientation_relation.pose.orientation.w);\n\t\timu_delta_deg = 2.0f * acosf(CLAMP(imu_dot, 0.0f, 1.0f)) * 180.0f / (float)M_PI;\n\t}\n\n\tpssense->tracking.candidate_count++;\n'''
          if text.count(old_anchor) != 1:
              raise SystemExit(f'expected exactly one callback anchor, found {text.count(old_anchor)}')
          text = text.replace(old_anchor, new_anchor, 1)

          old_log = '''\tPSSENSE_INFO(pssense,\n\t             "CONSTELLATION_CANDIDATE side=%c ts=%" PRIi64\n\t             " cam=%zu pos=(%.6f,%.6f,%.6f) quat=(%.6f,%.6f,%.6f,%.6f) matched=%u visible=%u reproj=%.3f "\n\t             "brightness=%.3f",\n\t             pssense->hand == XRT_HAND_LEFT ? 'L' : 'R', sample->timestamp_ns, sample->camera_index,\n\t             sample->pose.position.x, sample->pose.position.y, sample->pose.position.z,\n\t             sample->pose.orientation.x, sample->pose.orientation.y, sample->pose.orientation.z,\n\t             sample->pose.orientation.w, sample->metrics.matched_blob_count, sample->metrics.visible_led_count,\n\t             sample->metrics.reprojection_error, sample->average_brightness);\n'''
          new_log = '''\tPSSENSE_INFO(pssense,\n\t             "CONSTELLATION_CANDIDATE side=%c ts=%" PRIi64\n\t             " cam=%zu pos=(%.6f,%.6f,%.6f) quat=(%.6f,%.6f,%.6f,%.6f) matched=%u visible=%u reproj=%.3f "\n\t             "brightness=%.3f imu_valid=%u imu_quat=(%.6f,%.6f,%.6f,%.6f) imu_delta_deg=%.2f",\n\t             pssense->hand == XRT_HAND_LEFT ? 'L' : 'R', sample->timestamp_ns, sample->camera_index,\n\t             sample->pose.position.x, sample->pose.position.y, sample->pose.position.z,\n\t             sample->pose.orientation.x, sample->pose.orientation.y, sample->pose.orientation.z,\n\t             sample->pose.orientation.w, sample->metrics.matched_blob_count, sample->metrics.visible_led_count,\n\t             sample->metrics.reprojection_error, sample->average_brightness, have_imu_orientation ? 1u : 0u,\n\t             imu_orientation_relation.pose.orientation.x, imu_orientation_relation.pose.orientation.y,\n\t             imu_orientation_relation.pose.orientation.z, imu_orientation_relation.pose.orientation.w, imu_delta_deg);\n'''
          if text.count(old_log) != 1:
              raise SystemExit(f'expected exactly one candidate log block, found {text.count(old_log)}')
          text = text.replace(old_log, new_log, 1)

          path.write_text(text)
          PY

          git diff --check
          git diff -- src/xrt/drivers/pssense/pssense_driver.c

      - name: Install build dependencies
        run: brew install cmake eigen glslang libusb ninja opencv

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DBUILD_TESTING=OFF
          -DXRT_FEATURE_OPENXR=OFF
          -DXRT_FEATURE_SERVICE=OFF
          -DXRT_MODULE_COMPOSITOR=OFF
          -DXRT_MODULE_COMPOSITOR_CLIENT=OFF
          -DXRT_MODULE_COMPOSITOR_MAIN=OFF
          -DXRT_MODULE_COMPOSITOR_MULTI=OFF
          -DXRT_MODULE_COMPOSITOR_NULL=OFF
          -DXRT_MODULE_COMPOSITOR_RENDER=OFF
          -DXRT_MODULE_COMPOSITOR_SHADERS=OFF
          -DXRT_MODULE_COMPOSITOR_UTIL=OFF
          -DXRT_MODULE_COMPOSITOR_MOCK=OFF
          -DXRT_MODULE_OPENXR_STATE_TRACKER=OFF
          -DXRT_MODULE_IPC=OFF
          -DXRT_MODULE_MONADO_GUI=OFF
          -DXRT_FEATURE_WINDOW_PEEK=OFF
          -DXRT_FEATURE_DEBUG_GUI=OFF
          -DXRT_FEATURE_CLIENT_DEBUG_GUI=OFF
          -DXRT_BUILD_DRIVER_PSVR2=ON
          -DXRT_BUILD_DRIVER_PSSENSE=ON
          -DXRT_BUILD_DRIVER_QWERTY=OFF
          -DXRT_BUILD_DRIVER_SIMULATED=ON

      - name: Build Sense driver and CLI
        run: |
          set -o pipefail
          cmake --build build --target drv_pssense monado-cli --parallel 2>&1 | tee build.log

      - name: Commit diagnostic patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/xrt/drivers/pssense/pssense_driver.c
          git commit -m "pssense: log optical candidate IMU residuals"
          git push origin HEAD:macos-psvr2-camera-calibration
