name: macOS direct service XPC

on:
  push:
    branches:
      - macos-service-direct-xpc
      - macos-service-direct-xpc-owned-resources
      - macos-service-direct-xpc-cadence
      - macos-depth-aware-reprojection
      - macos-wine-iosurface-import
      - macos-wine-openxr-d3d11
    paths:
      - .github/workflows/macos-service-direct-xpc.yml
      - CMakeLists.txt
      - src/xrt/CMakeLists.txt
      - src/xrt/auxiliary/**
      - src/xrt/compositor/**
      - src/xrt/ipc/**
      - src/xrt/targets/**
      - scripts/macos/**
      - tests/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-service-xpc:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check Wine/DXMT helper syntax
        run: |
          zsh -n scripts/macos/provision-wine-dxmt.zsh
          zsh -n scripts/macos/build-wine-d3d11-iosurface-producer.zsh
          zsh -n scripts/macos/run-wine-d3d11-iosurface-import.zsh
          zsh -n scripts/macos/build-wine-openxr-d3d11.zsh
          zsh -n scripts/macos/build-wine-hello-xr-d3d11.zsh
          zsh -n scripts/macos/run-wine-hello-xr-d3d11.zsh
          zsh -n scripts/macos/build-wine-dxmt-gpu-sync.zsh
          zsh -n scripts/macos/build-wine-openvr-smoke.zsh
          zsh -n scripts/macos/provision-opencomposite.zsh
          zsh -n scripts/macos/run-wine-openvr-opencomposite-smoke.zsh
          zsh -n scripts/macos/install-opencomposite-game.zsh
          zsh -n scripts/macos/run-wine-openvr-game.zsh

      - name: Install dependencies
        run: brew install cmake eigen glslang libusb ninja molten-vk pkgconf vulkan-headers vulkan-loader

      - name: Configure service build
        run: >-
          cmake -S . -B build-service -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/monado-install"
          -DBUILD_TESTING=OFF
          -DXRT_FEATURE_SERVICE=ON
          -DXRT_HAVE_OPENGLES=OFF
          -DXRT_HAVE_SDL2=OFF
          -DXRT_MODULE_MONADO_GUI=OFF
          -DXRT_FEATURE_WINDOW_PEEK=OFF
          -DXRT_FEATURE_DEBUG_GUI=OFF
          -DXRT_FEATURE_CLIENT_DEBUG_GUI=OFF
          -DXRT_BUILD_DRIVER_QWERTY=OFF
          -DXRT_BUILD_DRIVER_PSVR2=ON
          -DXRT_BUILD_DRIVER_PSSENSE=OFF

      - name: Build default Release target set
        run: cmake --build build-service --parallel

      - name: Verify service targets were built
        run: |
          test -x build-service/src/xrt/targets/service/monado-service
          test -x build-service/src/xrt/targets/service/monado-service-xpc-control

      - name: Verify repeatable install
        run: |
          cmake --install build-service
          cmake --install build-service

  build-full-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake eigen glslang jpeg-turbo libusb mingw-w64 molten-vk ninja pkgconf sdl2-compat vulkan-headers vulkan-loader

      - name: Cross-build Windows D3D11 IOSurface producer
        run: scripts/macos/build-wine-d3d11-iosurface-producer.zsh

      - name: Cross-build Khronos hello_xr D3D11 sample
        run: scripts/macos/build-wine-hello-xr-d3d11.zsh

      - name: Cross-build Wine OpenXR D3D11 runtime
        run: scripts/macos/build-wine-openxr-d3d11.zsh

      - name: Cross-build OpenVR/OpenComposite smoke test
        run: scripts/macos/build-wine-openvr-smoke.zsh

      - name: Check Monado DXMT patch series
        run: |
          git clone --quiet https://github.com/3Shain/dxmt.git "${RUNNER_TEMP}/dxmt-v080"
          git -C "${RUNNER_TEMP}/dxmt-v080" checkout --quiet 589adb780354b461645b29999cefaf533594ee99
          for patch in "${GITHUB_WORKSPACE}"/scripts/macos/dxmt-patches/*.patch; do
            git -C "${RUNNER_TEMP}/dxmt-v080" apply --check "${patch}"
            git -C "${RUNNER_TEMP}/dxmt-v080" apply "${patch}"
          done

      - name: Configure full Release build
        run: >-
          cmake -S . -B build-release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/monado-full-install"
          -DXRT_FEATURE_SERVICE=ON
          -DXRT_HAVE_OPENGLES=OFF
          -DXRT_BUILD_DRIVER_PSVR2=ON
          -DXRT_BUILD_DRIVER_PSSENSE=OFF

      - name: Build full Release target set
        run: cmake --build build-release --parallel

      - name: Verify main installed targets were built
        run: |
          test -x build-release/src/xrt/targets/cli/monado-cli
          test -x build-release/src/xrt/targets/psvr2_openxr_test/psvr2-openxr-test
          test -x build-release/src/xrt/targets/service/monado-service
          test -x build-release/src/xrt/targets/service/monado-service-xpc-control
          test -x build-release/tests/tests_macos_iosurface_producer
          test -x build-release/tests/tests_macos_iosurface_import_probe
          test -f build-wine-dxmt/bin/macos_wine_d3d11_iosurface_producer.exe
          test -f build-wine-openxr/openxr_monado-dev.json
          test -f build-wine-hello-xr/khr_hello_xr_d3d11.exe
          test -f build-wine-openvr/openvr_opencomposite_smoke.exe

      - name: Verify repeatable full install
        run: |
          cmake --install build-release
          cmake --install build-release
