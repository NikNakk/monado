name: Apply Metal probe native fullscreen mode v3

on:
  push:
    branches:
      - macos-psvr2-timing-diagnostics
    paths:
      - .github/workflows/apply-metal-probe-native-fullscreen-v3.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: macos-psvr2-timing-diagnostics
      - name: Apply native fullscreen source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap

          wf = Path('.github/workflows/apply-metal-probe-native-fullscreen-v2.yml').read_text()
          m = re.search(r"python3 - <<'PY'\n(.*?)\n          PY", wf, re.S)
          if not m:
              raise SystemExit('Could not recover v2 patch script')
          script = textwrap.dedent(m.group(1))
          # The only known mismatch in v2 is the console text: current source says yes/no, not on/off.
          script = '\n'.join(line for line in script.splitlines() if 'print("  framebuffer only:' not in line)
          exec(compile(script, '<fullscreen-patch>', 'exec'))

          p = Path('tools/macos-metal-latency-probe/Sources/MetalLatencyProbe/main.swift')
          s = p.read_text()
          old = '        print("  framebuffer only: \\(layer.framebufferOnly ? "yes" : "no")")\n'
          new = old + '        print("  window mode: \\(options.windowMode.rawValue)")\n'
          if old not in s:
              raise SystemExit('Could not add window-mode console line')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Compile standalone probe
        shell: bash
        run: |
          cd tools/macos-metal-latency-probe
          swift build -c release
      - name: Commit tested source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/macos-metal-latency-probe/Sources/MetalLatencyProbe/main.swift tools/macos-metal-latency-probe/README.md
          git rm .github/workflows/apply-metal-probe-native-fullscreen.yml .github/workflows/apply-metal-probe-native-fullscreen-v2.yml .github/workflows/apply-metal-probe-native-fullscreen-v3.yml
          git commit -m 'feat: add native fullscreen mode to Metal latency probe'
          git push
