name: Apply PS Sense authoritative fusion patch once

on:
  push:
    branches:
      - macos-psvr2-camera-calibration
    paths:
      - '.github/workflows/pssense-authoritative-fusion-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: macos-psvr2-camera-calibration
          fetch-depth: 0
      - name: Make synchronized fusion authoritative
        run: python3 scripts/apply_pssense_authoritative_fusion_once.py
      - name: Verify patch shape
        run: |
          grep -n "CONSTELLATION_FUSED_ACCEPT" src/xrt/drivers/pssense/pssense_driver.c
          ! grep -q "Fusion is diagnostic only" src/xrt/drivers/pssense/pssense_driver.c
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/xrt/drivers/pssense/pssense_driver.c
          git commit -m "pssense: make multicamera fusion authoritative"
          git push origin HEAD:macos-psvr2-camera-calibration
