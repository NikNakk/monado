name: Apply standalone macOS Metal latency probe

on:
  push:
    branches:
      - macos-psvr2-timing-diagnostics
    paths:
      - .github/workflows/apply-macos-metal-latency-probe.yml

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: macos-psvr2-timing-diagnostics
      - name: Materialize standalone probe
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, pathlib, shutil, zipfile
          data = ''''''
          root = pathlib.Path('/tmp/probe-src')
          if root.exists(): shutil.rmtree(root)
          root.mkdir(parents=True)
          z = root / 'probe.zip'
          z.write_bytes(base64.b64decode(data))
          with zipfile.ZipFile(z) as archive:
              archive.extractall(root)
          src = root / 'macos-metal-latency-probe'
          dst = pathlib.Path('tools/macos-metal-latency-probe')
          if dst.exists(): shutil.rmtree(dst)
          dst.parent.mkdir(parents=True, exist_ok=True)
          shutil.copytree(src, dst)
          PY
      - name: Compile standalone probe
        shell: bash
        run: |
          cd tools/macos-metal-latency-probe
          swift build -c release
      - name: Commit tested source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/macos-metal-latency-probe
          git rm .github/workflows/apply-macos-metal-latency-probe.yml
          git commit -m 'feat: add standalone macOS Metal latency probe [metal-probe applied]'
          git push
