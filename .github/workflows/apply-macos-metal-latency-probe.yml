name: Apply standalone macOS Metal latency probe

on:
  push:
    branches:
      - macos-psvr2-timing-diagnostics
    paths:
      - .github/workflows/apply-macos-metal-latency-probe.yml

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: macos-psvr2-timing-diagnostics
          fetch-depth: 0
      - name: Recover and patch standalone probe
        shell: bash
        run: |
          git show 98e3d3c5b982a0ad5a29cae8264ddda2a4ccb779:.github/workflows/apply-macos-metal-latency-probe.yml > /tmp/original-probe-workflow.yml
          python3 - <<'PY'
          import base64, pathlib, re, shutil, zipfile
          workflow = pathlib.Path('/tmp/original-probe-workflow.yml').read_text()
          m = re.search(r"data = '''([A-Za-z0-9+/=]+)'''", workflow)
          assert m, 'could not recover staged ZIP from original workflow'
          root = pathlib.Path('/tmp/probe-src')
          if root.exists(): shutil.rmtree(root)
          root.mkdir(parents=True)
          z = root / 'probe.zip'
          z.write_bytes(base64.b64decode(m.group(1), validate=True))
          with zipfile.ZipFile(z) as archive:
              archive.extractall(root)
          src = root / 'macos-metal-latency-probe'
          dst = pathlib.Path('tools/macos-metal-latency-probe')
          if dst.exists(): shutil.rmtree(dst)
          dst.parent.mkdir(parents=True, exist_ok=True)
          shutil.copytree(src, dst)

          p = dst / 'Sources/MetalLatencyProbe/main.swift'
          s = p.read_text()
          s = s.replace('drawableID: drawable.drawableID,', 'drawableID: UInt64(drawable.drawableID),')
          s = s.replace('private final class AppDelegate: NSObject, NSApplicationDelegate {', '@MainActor\nprivate final class AppDelegate: NSObject, NSApplicationDelegate {')
          s = s.replace('\nlet options: Options\n', '\nprivate let options: Options\n')
          s = s.replace('\nlet delegate = AppDelegate(options: options)\n', '\nprivate let delegate = AppDelegate(options: options)\n')
          s = s.replace('private let cvOutputCallback: CVDisplayLinkOutputCallback =', 'nonisolated(unsafe) private let cvOutputCallback: CVDisplayLinkOutputCallback =')
          # Do not stop a CVDisplayLink synchronously from its own output callback.
          s = s.replace('            CVDisplayLinkStop(link)\n', '')
          p.write_text(s)
          PY
      - name: Compile standalone probe
        shell: bash
        run: |
          cd tools/macos-metal-latency-probe
          swift build -c release
      - name: Commit tested source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/macos-metal-latency-probe
          git rm .github/workflows/apply-macos-metal-latency-probe.yml
          git commit -m 'feat: add standalone macOS Metal latency probe [metal-probe applied]'
          git push
