name: Apply PSVR2 horizon diagnostics

on:
  push:
    branches:
      - macos-psvr2-timing-diagnostics
    paths:
      - .github/workflows/apply-psvr2-horizon-diagnostics.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: macos-psvr2-timing-diagnostics
      - name: Apply source edits
        run: python3 tools/apply_psvr2_horizon_diagnostics.py
      - name: Commit source change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/xrt/drivers/psvr2/psvr2.c
          git commit -m 'feat: score PSVR2 long-horizon position predictions [horizon-diagnostics applied]'
          git push
