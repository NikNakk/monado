name: Apply PSVR2 long-horizon predictor diagnostics
on:
  push:
    branches: [macos-psvr2-timing-diagnostics]
    paths: [.github/workflows/apply-psvr2-horizon-diagnostics.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: macos-psvr2-timing-diagnostics
      - name: Apply source edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/xrt/drivers/psvr2/psvr2.c')
          s = p.read_text()

          old = '''#ifdef XRT_OS_OSX
struct psvr2_timing_trace_state
{'''
          new = '''#ifdef XRT_OS_OSX
#define PSVR2_PENDING_HORIZON_PREDICTIONS 256

struct psvr2_pending_horizon_prediction
{
\tbool valid;
\tuint64_t sequence;
\ttimepoint_ns query_host_ns;
\ttimepoint_ns source_slam_vts_ns;
\ttimepoint_ns target_vts_ns;
\tstruct xrt_vec3 source_position;
\tstruct xrt_vec3 raw_velocity;
\tstruct xrt_vec3 filtered_velocity;
\tstruct xrt_vec3 raw_predicted_position;
\tstruct xrt_vec3 filtered_predicted_position;
};

struct psvr2_timing_trace_state
{'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''\tFILE *pose;
\tFILE *prediction;
\tuint64_t imu_rows;'''
          new = '''\tFILE *pose;
\tFILE *prediction;
\tFILE *horizon;
\tuint64_t imu_rows;'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''\tuint64_t pose_rows;
\tuint64_t prediction_rows;
\tatomic_uint_fast32_t last_dp_scanout;'''
          new = '''\tuint64_t pose_rows;
\tuint64_t prediction_rows;
\tuint64_t horizon_rows;
\tuint64_t horizon_sequence;
\tuint32_t horizon_next_slot;
\tstruct psvr2_pending_horizon_prediction horizon_pending[PSVR2_PENDING_HORIZON_PREDICTIONS];
\tatomic_uint_fast32_t last_dp_scanout;'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''\tg_psvr2_timing_trace.prediction = psvr2_timing_trace_open_file(
\t    "prediction",
\t    "slam_vts_ns,dt_ns,actual_x,actual_y,actual_z,predicted_x,predicted_y,predicted_z,error_x,error_y,error_z,"
\t    "error_mm,error_along_mm,prior_vel_x,prior_vel_y,prior_vel_z,estimated_vel_x,estimated_vel_y,estimated_vel_z,"
\t    "filtered_vel_x,filtered_vel_y,filtered_vel_z,filter_alpha,filter_enabled");'''
          new = old + '''
\tg_psvr2_timing_trace.horizon = psvr2_timing_trace_open_file(
\t    "horizon",
\t    "sequence,query_host_ns,source_slam_vts_ns,target_vts_ns,horizon_ns,score_slam_vts_ns,"
\t    "actual_x,actual_y,actual_z,raw_pred_x,raw_pred_y,raw_pred_z,filtered_pred_x,filtered_pred_y,filtered_pred_z,"
\t    "raw_error_mm,filtered_error_mm,raw_along_mm,filtered_along_mm,source_x,source_y,source_z,"
\t    "raw_vel_x,raw_vel_y,raw_vel_z,filtered_vel_x,filtered_vel_y,filtered_vel_z,filter_alpha,filter_enabled");'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''\tFILE *files[] = {g_psvr2_timing_trace.imu, g_psvr2_timing_trace.slam, g_psvr2_timing_trace.pose,
\t                 g_psvr2_timing_trace.prediction};
\tfor (size_t i = 0; i < 4; i++) {'''
          new = '''\tFILE *files[] = {g_psvr2_timing_trace.imu, g_psvr2_timing_trace.slam, g_psvr2_timing_trace.pose,
\t                 g_psvr2_timing_trace.prediction, g_psvr2_timing_trace.horizon};
\tfor (size_t i = 0; i < 5; i++) {'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''\tg_psvr2_timing_trace.pose = NULL;
\tg_psvr2_timing_trace.prediction = NULL;
}'''
          new = '''\tg_psvr2_timing_trace.pose = NULL;
\tg_psvr2_timing_trace.prediction = NULL;
\tg_psvr2_timing_trace.horizon = NULL;
}'''
          assert old in s
          s = s.replace(old, new, 1)

          marker = '''\tg_psvr2_timing_trace.prediction_rows++;
\tpsvr2_timing_trace_maybe_flush(file, g_psvr2_timing_trace.prediction_rows, 256);
}

#endif'''
          replacement = '''\tg_psvr2_timing_trace.prediction_rows++;
\tpsvr2_timing_trace_maybe_flush(file, g_psvr2_timing_trace.prediction_rows, 256);
}

static float
psvr2_vec3_length(const struct xrt_vec3 *v)
{
\treturn sqrtf(v->x * v->x + v->y * v->y + v->z * v->z);
}

static void
psvr2_timing_trace_enqueue_horizon(struct psvr2_hmd *hmd, timepoint_ns query_host_ns, timepoint_ns target_vts_ns)
{
\tif (g_psvr2_timing_trace.horizon == NULL) {
\t\treturn;
\t}
\tstruct xrt_space_relation latest = XRT_SPACE_RELATION_ZERO;
\ttimepoint_ns latest_ts = 0;
\tif (!m_relation_history_get_latest(hmd->slam_relation_history, &latest_ts, &latest) || target_vts_ns <= latest_ts) {
\t\treturn;
\t}
\tif ((latest.relation_flags & XRT_SPACE_RELATION_LINEAR_VELOCITY_VALID_BIT) == 0) {
\t\treturn;
\t}

\tfloat dt_s = (float)((double)(target_vts_ns - latest_ts) / 1000000000.0);
\tstruct xrt_vec3 filtered_velocity = hmd->filtered_linear_velocity_initialized
\t                                        ? hmd->filtered_linear_velocity
\t                                        : latest.linear_velocity;
\tstruct psvr2_pending_horizon_prediction pending = {
\t    .valid = true,
\t    .sequence = ++g_psvr2_timing_trace.horizon_sequence,
\t    .query_host_ns = query_host_ns,
\t    .source_slam_vts_ns = latest_ts,
\t    .target_vts_ns = target_vts_ns,
\t    .source_position = latest.pose.position,
\t    .raw_velocity = latest.linear_velocity,
\t    .filtered_velocity = filtered_velocity,
\t    .raw_predicted_position = {
\t        latest.pose.position.x + latest.linear_velocity.x * dt_s,
\t        latest.pose.position.y + latest.linear_velocity.y * dt_s,
\t        latest.pose.position.z + latest.linear_velocity.z * dt_s,
\t    },
\t    .filtered_predicted_position = {
\t        latest.pose.position.x + filtered_velocity.x * dt_s,
\t        latest.pose.position.y + filtered_velocity.y * dt_s,
\t        latest.pose.position.z + filtered_velocity.z * dt_s,
\t    },
\t};
\tuint32_t slot = g_psvr2_timing_trace.horizon_next_slot++ % PSVR2_PENDING_HORIZON_PREDICTIONS;
\tg_psvr2_timing_trace.horizon_pending[slot] = pending;
}

static void
psvr2_timing_trace_score_horizon(timepoint_ns previous_slam_vts_ns,
                                 const struct xrt_vec3 *previous_position,
                                 timepoint_ns current_slam_vts_ns,
                                 const struct xrt_vec3 *current_position)
{
\tFILE *file = g_psvr2_timing_trace.horizon;
\tif (file == NULL || current_slam_vts_ns <= previous_slam_vts_ns) {
\t\treturn;
\t}

\tstruct xrt_vec3 segment = {current_position->x - previous_position->x,
\t                           current_position->y - previous_position->y,
\t                           current_position->z - previous_position->z};
\tfloat segment_length = psvr2_vec3_length(&segment);

\tfor (uint32_t i = 0; i < PSVR2_PENDING_HORIZON_PREDICTIONS; i++) {
\t\tstruct psvr2_pending_horizon_prediction *p = &g_psvr2_timing_trace.horizon_pending[i];
\t\tif (!p->valid || p->target_vts_ns > current_slam_vts_ns) {
\t\t\tcontinue;
\t\t}
\t\tif (p->target_vts_ns < previous_slam_vts_ns) {
\t\t\tp->valid = false;
\t\t\tcontinue;
\t\t}

\t\tdouble fraction = (double)(p->target_vts_ns - previous_slam_vts_ns) /
\t\t                  (double)(current_slam_vts_ns - previous_slam_vts_ns);
\t\tif (fraction < 0.0) fraction = 0.0;
\t\tif (fraction > 1.0) fraction = 1.0;
\t\tstruct xrt_vec3 actual = {
\t\t    previous_position->x + (float)fraction * segment.x,
\t\t    previous_position->y + (float)fraction * segment.y,
\t\t    previous_position->z + (float)fraction * segment.z,
\t\t};
\t\tstruct xrt_vec3 raw_error = {actual.x - p->raw_predicted_position.x,
\t\t                             actual.y - p->raw_predicted_position.y,
\t\t                             actual.z - p->raw_predicted_position.z};
\t\tstruct xrt_vec3 filtered_error = {actual.x - p->filtered_predicted_position.x,
\t\t                                  actual.y - p->filtered_predicted_position.y,
\t\t                                  actual.z - p->filtered_predicted_position.z};
\t\tfloat raw_along_m = 0.0f;
\t\tfloat filtered_along_m = 0.0f;
\t\tif (segment_length > 0.0001f) {
\t\t\traw_along_m = (raw_error.x * segment.x + raw_error.y * segment.y + raw_error.z * segment.z) /
\t\t\t              segment_length;
\t\t\tfiltered_along_m =
\t\t\t    (filtered_error.x * segment.x + filtered_error.y * segment.y + filtered_error.z * segment.z) /
\t\t\t    segment_length;
\t\t}
\t\tfloat alpha = debug_get_float_option_psvr2_linear_velocity_alpha();
\t\tif (alpha < 0.0f) alpha = 0.0f;
\t\tif (alpha > 1.0f) alpha = 1.0f;
\t\tfprintf(file,
\t\t        "%" PRIu64 ",%" PRIi64 ",%" PRIi64 ",%" PRIi64 ",%" PRIi64 ",%" PRIi64 ","
\t\t        "%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,"
\t\t        "%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%u\\n",
\t\t        p->sequence, (int64_t)p->query_host_ns, (int64_t)p->source_slam_vts_ns, (int64_t)p->target_vts_ns,
\t\t        (int64_t)(p->target_vts_ns - p->source_slam_vts_ns), (int64_t)current_slam_vts_ns, actual.x, actual.y,
\t\t        actual.z, p->raw_predicted_position.x, p->raw_predicted_position.y, p->raw_predicted_position.z,
\t\t        p->filtered_predicted_position.x, p->filtered_predicted_position.y, p->filtered_predicted_position.z,
\t\t        psvr2_vec3_length(&raw_error) * 1000.0f, psvr2_vec3_length(&filtered_error) * 1000.0f,
\t\t        raw_along_m * 1000.0f, filtered_along_m * 1000.0f, p->source_position.x, p->source_position.y,
\t\t        p->source_position.z, p->raw_velocity.x, p->raw_velocity.y, p->raw_velocity.z,
\t\t        p->filtered_velocity.x, p->filtered_velocity.y, p->filtered_velocity.z, alpha,
\t\t        debug_get_bool_option_psvr2_filtered_linear_prediction() ? 1u : 0u);
\t\tg_psvr2_timing_trace.horizon_rows++;
\t\tp->valid = false;
\t}
\tpsvr2_timing_trace_maybe_flush(file, g_psvr2_timing_trace.horizon_rows, 256);
}

#endif'''
          assert marker in s
          s = s.replace(marker, replacement, 1)

          old = '''\t// Push the normal head pose
\thmd_get_raw_tracker_pose(hmd, prediction_ns_hw, m_relation_chain_reserve(&chain));'''
          new = '''\t// Push the normal head pose
#ifdef XRT_OS_OSX
\tif (name == XRT_INPUT_GENERIC_HEAD_POSE) {
\t\tpsvr2_timing_trace_enqueue_horizon(hmd, trace_host_query_ns, prediction_ns_hw);
\t}
#endif
\thmd_get_raw_tracker_pose(hmd, prediction_ns_hw, m_relation_chain_reserve(&chain));'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''\tif (have_prior_relation && pose_sample.timestamp_ns > prior_relation_ts) {
\t\tprediction_dt_ns = pose_sample.timestamp_ns - prior_relation_ts;
\t\tfloat dt_s = (float)((double)prediction_dt_ns / 1000000000.0);
\t\tpredicted_position.x = prior_relation.pose.position.x + prior_relation.linear_velocity.x * dt_s;
\t\tpredicted_position.y = prior_relation.pose.position.y + prior_relation.linear_velocity.y * dt_s;
\t\tpredicted_position.z = prior_relation.pose.position.z + prior_relation.linear_velocity.z * dt_s;
\t}

\tm_relation_history_push_with_motion_estimation(hmd->slam_relation_history, &relation, pose_sample.timestamp_ns);'''
          new = '''\tif (have_prior_relation && pose_sample.timestamp_ns > prior_relation_ts) {
\t\tprediction_dt_ns = pose_sample.timestamp_ns - prior_relation_ts;
\t\tfloat dt_s = (float)((double)prediction_dt_ns / 1000000000.0);
\t\tpredicted_position.x = prior_relation.pose.position.x + prior_relation.linear_velocity.x * dt_s;
\t\tpredicted_position.y = prior_relation.pose.position.y + prior_relation.linear_velocity.y * dt_s;
\t\tpredicted_position.z = prior_relation.pose.position.z + prior_relation.linear_velocity.z * dt_s;
\t}

#ifdef XRT_OS_OSX
\tif (have_prior_relation) {
\t\tpsvr2_timing_trace_score_horizon(prior_relation_ts, &prior_relation.pose.position, pose_sample.timestamp_ns,
\t\t                                 &relation.pose.position);
\t}
#endif

\tm_relation_history_push_with_motion_estimation(hmd->slam_relation_history, &relation, pose_sample.timestamp_ns);'''
          assert old in s
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/xrt/drivers/psvr2/psvr2.c
          git commit -m 'feat: score PSVR2 long-horizon position predictions [horizon-diagnostics applied]'
          git push
          git rm .github/workflows/apply-psvr2-horizon-diagnostics.yml
          git commit -m 'chore: remove temporary horizon diagnostics workflow'
          git push
