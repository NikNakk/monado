name: macOS PS Sense HID

on:
  push:
    branches:
      - macos-pssense-hid
      - macos-psvr2-camera-calibration
    paths:
      - .github/workflows/macos-pssense-hid.yml
      - CMakeLists.txt
      - scripts/psvr2_charuco_calibrate.py
      - scripts/psvr2_calibration_solver.py
      - scripts/psvr2_camera_calibration.schema.json
      - scripts/psvr2_calibration_assess.py
      - tests/test_psvr2_calibration_solver.py
      - tests/test_psvr2_camera_mode_survey.py
      - scripts/psvr2_camera_mode_survey.py
      - scripts/psvr2_cross_mode_register.py
      - scripts/psvr2_visible_calibration_record.py
      - src/xrt/auxiliary/os/**
      - src/xrt/auxiliary/math/**
      - src/xrt/auxiliary/tracking/**
      - src/xrt/include/tracking/**
      - src/xrt/include/xrt/xrt_tracking.h
      - src/xrt/tracking/constellation/**
      - src/xrt/state_trackers/prober/**
      - src/xrt/drivers/pssense/**
      - src/xrt/drivers/psvr2/**
      - src/xrt/drivers/CMakeLists.txt
      - src/xrt/targets/common/**
      - src/xrt/targets/cli/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-hid-and-sense:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install cmake eigen glslang libusb ninja opencv

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DBUILD_TESTING=OFF
          -DXRT_FEATURE_OPENXR=OFF
          -DXRT_FEATURE_SERVICE=OFF
          -DXRT_MODULE_COMPOSITOR=OFF
          -DXRT_MODULE_COMPOSITOR_CLIENT=OFF
          -DXRT_MODULE_COMPOSITOR_MAIN=OFF
          -DXRT_MODULE_COMPOSITOR_MULTI=OFF
          -DXRT_MODULE_COMPOSITOR_NULL=OFF
          -DXRT_MODULE_COMPOSITOR_RENDER=OFF
          -DXRT_MODULE_COMPOSITOR_SHADERS=OFF
          -DXRT_MODULE_COMPOSITOR_UTIL=OFF
          -DXRT_MODULE_COMPOSITOR_MOCK=OFF
          -DXRT_MODULE_OPENXR_STATE_TRACKER=OFF
          -DXRT_MODULE_IPC=OFF
          -DXRT_MODULE_MONADO_GUI=OFF
          -DXRT_FEATURE_WINDOW_PEEK=OFF
          -DXRT_FEATURE_DEBUG_GUI=OFF
          -DXRT_FEATURE_CLIENT_DEBUG_GUI=OFF
          -DXRT_BUILD_DRIVER_PSVR2=ON
          -DXRT_BUILD_DRIVER_PSSENSE=ON
          -DXRT_BUILD_DRIVER_QWERTY=OFF
          -DXRT_BUILD_DRIVER_SIMULATED=ON

      - name: Build macOS HID, prober and Sense driver
        run: |
          set -o pipefail
          cmake --build build --target aux_os pssense_hid_probe st_prober drv_pssense target_lists monado-cli --parallel 2>&1 | tee build.log

      - name: Check calibration helper syntax
        run: >-
          python3 -m py_compile
          scripts/psvr2_charuco_calibrate.py
          scripts/psvr2_calibration_solver.py
          scripts/psvr2_calibration_assess.py
          scripts/psvr2_camera_mode_survey.py
          scripts/psvr2_cross_mode_register.py
          scripts/psvr2_visible_calibration_record.py

      - name: Test calibration and camera-capture plumbing
        run: >-
          python3 -m unittest
          tests/test_psvr2_calibration_solver.py
          tests/test_psvr2_camera_mode_survey.py

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-pssense-build-log
          path: build.log
