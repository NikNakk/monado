name: Apply macOS late-render experiment v3

on:
  push:
    branches:
      - macos-psvr2-timing-diagnostics
    paths:
      - .github/workflows/apply-macos-late-render.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: macos-psvr2-timing-diagnostics

      - name: Apply late-render patch
        shell: bash
        run: |
          printf '%s' ' sZCwlbGxkLCVsbGQsJWx sZCwlbGxkLCVsbGQsJWx sZCwlbGxkLCVsbGQsJWx sZCwlbGxkLCVsbGQsJWx sZCwlbGxkLCVsbGQ   ojZW5kaWYKCiAgICAgVk tUmVzdWx0IHJlcyA9IFZLX1NVQ0NFU1M7CglpZiAodXNlX2NvbXB1dGUpIHsKIiIiKQoKcmVwbCgKIiIiCWlmIChyZXMgIT0gVktfU1VDQ0VTUykgewoJCXJldHVybiBYUlRfRVJST1JfVlVMS0FOOwoJfQoKI2lmZGVmIFhSVF9GRUFUVVJFX1dJTkRPV19QRUVLCiIiLAoiIiIJ  dmsgPSAmci0+Yy0+YmFzZS52azsKIiIiLAoiIiJzdGF0aWMgdm9pZApyZW5kZXJlcl9maW5pKHN0cnVjdCBjb21wX3JlbmRlcmVyICpyKQp7CglzdHJ1Y3Qg  gYmFzZWxpbmUuCiIiIgpkLndyaXRlX3RleHQodGV4dCkK' | base64 --decode > /tmp/apply-late-render.py
          python3 /tmp/apply-late-render.py

      - name: Install dependencies
        run: brew install cmake eigen glslang libusb ninja molten-vk pkgconf vulkan-headers vulkan-loader

      - name: Configure compositor build
        run: >-
          cmake -S . -B build-compositor -G Ninja
          -DBUILD_TESTING=OFF
          -DXRT_HAVE_OPENGLES=OFF
          -DXRT_HAVE_SDL2=OFF
          -DXRT_MODULE_MONADO_GUI=OFF
          -DXRT_FEATURE_WINDOW_PEEK=OFF
          -DXRT_FEATURE_DEBUG_GUI=OFF
          -DXRT_FEATURE_CLIENT_DEBUG_GUI=OFF
          -DXRT_BUILD_DRIVER_QWERTY=OFF
          -DXRT_BUILD_DRIVER_PSVR2=ON
          -DXRT_BUILD_DRIVER_PSSENSE=OFF

      - name: Build macOS compositor and PSVR2 driver
        run: cmake --build build-compositor --target comp_main drv_psvr2 --parallel

      - name: Commit tested change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-macos-late-render.yml
          git add src/xrt/compositor/main/comp_renderer.c doc/macos-psvr2-timing-diagnostics.md
          git commit -m "diag: add macOS late-render experiment"
          git push
