name: Apply Metal probe native fullscreen mode

on:
  push:
    branches:
      - macos-psvr2-timing-diagnostics
    paths:
      - .github/workflows/apply-metal-probe-native-fullscreen.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: macos-psvr2-timing-diagnostics
      - name: Add native fullscreen window mode
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/macos-metal-latency-probe/Sources/MetalLatencyProbe/main.swift')
          s = p.read_text()

          def repl(old, new):
              global s
              if old not in s:
                  raise SystemExit('Expected source fragment not found:\n' + old[:300])
              s = s.replace(old, new, 1)

          repl(
          '''private struct Options {\n''',
          '''private enum WindowMode: String {\n    case borderless\n    case fullscreen\n}\n\nprivate struct Options {\n''')

          repl(
          '''    var framebufferOnly = true\n    var frameLimit = 0\n''',
          '''    var framebufferOnly = true\n    var windowMode: WindowMode = .borderless\n    var frameLimit = 0\n''')

          repl(
          '''          --no-framebuffer-only                  set CAMetalLayer.framebufferOnly = false\n          --frames N                             stop after N submitted frames (0 = run until Ctrl-C/Quit)\n''',
          '''          --no-framebuffer-only                  set CAMetalLayer.framebufferOnly = false\n          --window-mode borderless|fullscreen    AppKit window path (default: borderless)\n          --frames N                             stop after N submitted frames (0 = run until Ctrl-C/Quit)\n''')

          repl(
          '''            case "--no-framebuffer-only": o.framebufferOnly = false\n            case "--help", "-h":\n''',
          '''            case "--no-framebuffer-only": o.framebufferOnly = false\n            case "--window-mode":\n                let raw = try value(arg)\n                guard let m = WindowMode(rawValue: raw) else { throw ProbeError.argument("Unknown window mode: \\(raw)") }\n                o.windowMode = m\n            case "--help", "-h":\n''')

          repl(
          '''    let mode: String\n    let refreshHz: Double\n''',
          '''    let mode: String\n    let windowMode: String\n    let refreshHz: Double\n''')

          repl(
          '''        mode: String,\n        refreshHz: Double,\n''',
          '''        mode: String,\n        windowMode: String,\n        refreshHz: Double,\n''')

          repl(
          '''        self.mode = mode\n        self.refreshHz = refreshHz\n''',
          '''        self.mode = mode\n        self.windowMode = windowMode\n        self.refreshHz = refreshHz\n''')

          repl(
          '''        "sequence", "mode", "refresh_hz", "drawable_count", "display_sync", "framebuffer_only", "cpu_delay_ms", "gpu_burn_passes", "wait_completed",\n''',
          '''        "sequence", "mode", "window_mode", "refresh_hz", "drawable_count", "display_sync", "framebuffer_only", "cpu_delay_ms", "gpu_burn_passes", "wait_completed",\n''')

          repl(
          '''            "\\(r.sequence)", r.mode, fmt(r.refreshHz), "\\(r.drawableCount)", r.displaySync ? "1" : "0", r.framebufferOnly ? "1" : "0",\n''',
          '''            "\\(r.sequence)", r.mode, r.windowMode, fmt(r.refreshHz), "\\(r.drawableCount)", r.displaySync ? "1" : "0", r.framebufferOnly ? "1" : "0",\n''')

          repl(
          '''        print("  framebuffer only: \\(layer.framebufferOnly ? "on" : "off")")\n        print("  CPU delay: \\(options.cpuDelayMs) ms")\n''',
          '''        print("  framebuffer only: \\(layer.framebufferOnly ? "on" : "off")")\n        print("  window mode: \\(options.windowMode.rawValue)")\n        print("  CPU delay: \\(options.cpuDelayMs) ms")\n''')

          repl(
          '''            sequence: seq,\n            mode: options.mode.rawValue,\n            refreshHz: refreshHz,\n''',
          '''            sequence: seq,\n            mode: options.mode.rawValue,\n            windowMode: options.windowMode.rawValue,\n            refreshHz: refreshHz,\n''')

          repl(
          '''private final class AppDelegate: NSObject, NSApplicationDelegate {\n    private let options: Options\n    private var renderer: Renderer?\n    private var window: NSWindow?\n''',
          '''private final class AppDelegate: NSObject, NSApplicationDelegate, NSWindowDelegate {\n    private let options: Options\n    private var renderer: Renderer?\n    private var window: NSWindow?\n    private var rendererStarted = false\n''')

          repl(
          '''    func applicationWillTerminate(_ notification: Notification) {\n        renderer?.stop()\n    }\n\n    private func setup() throws {\n''',
          '''    func applicationWillTerminate(_ notification: Notification) {\n        renderer?.stop()\n    }\n\n    func windowDidEnterFullScreen(_ notification: Notification) {\n        print("Native AppKit fullscreen entered")\n        startRendererIfNeeded()\n    }\n\n    private func startRendererIfNeeded() {\n        guard !rendererStarted, let renderer else { return }\n        do {\n            try renderer.start()\n            rendererStarted = true\n        } catch {\n            fputs("metal-latency-probe: \\(error)\\n", stderr)\n            NSApp.terminate(nil)\n        }\n    }\n\n    private func setup() throws {\n''')

          old_window = '''        let window = NSWindow(\n            contentRect: screen.frame,\n            styleMask: .borderless,\n            backing: .buffered,\n            defer: false,\n            screen: screen\n        )\n        window.contentView = view\n        window.backgroundColor = .black\n        window.hasShadow = false\n        window.hidesOnDeactivate = false\n        window.ignoresMouseEvents = true\n        window.level = .mainMenu + 1\n        window.collectionBehavior = [.canJoinAllSpaces, .fullScreenAuxiliary, .stationary]\n        window.setFrame(screen.frame, display: true)\n        window.orderFrontRegardless()\n        self.window = window\n\n        CATransaction.flush()\n        print("Target display: \\(screen.localizedName) \\(pixelWidth)x\\(pixelHeight), CG refresh \\(String(format: "%.3f", displayModeHz)) Hz")\n\n        let renderer = try Renderer(options: options, layer: metalLayer, displayID: displayID, refreshHz: refreshHz)\n        self.renderer = renderer\n        try renderer.start()\n'''
          new_window = '''        view.autoresizingMask = [.width, .height]\n\n        let styleMask: NSWindow.StyleMask = options.windowMode == .fullscreen\n            ? [.titled, .closable, .miniaturizable, .resizable]\n            : .borderless\n        let window = NSWindow(\n            contentRect: screen.frame,\n            styleMask: styleMask,\n            backing: .buffered,\n            defer: false,\n            screen: screen\n        )\n        window.contentView = view\n        window.backgroundColor = .black\n        window.isOpaque = true\n        window.hasShadow = false\n        window.hidesOnDeactivate = false\n        window.ignoresMouseEvents = true\n        window.setFrame(screen.frame, display: true)\n        window.delegate = self\n\n        if options.windowMode == .fullscreen {\n            window.collectionBehavior = [.fullScreenPrimary]\n            window.titleVisibility = .hidden\n            window.titlebarAppearsTransparent = true\n            window.makeKeyAndOrderFront(nil)\n        } else {\n            window.level = .mainMenu + 1\n            window.collectionBehavior = [.canJoinAllSpaces, .fullScreenAuxiliary, .stationary]\n            window.orderFrontRegardless()\n        }\n        self.window = window\n\n        CATransaction.flush()\n        print("Target display: \\(screen.localizedName) \\(pixelWidth)x\\(pixelHeight), CG refresh \\(String(format: "%.3f", displayModeHz)) Hz")\n\n        let renderer = try Renderer(options: options, layer: metalLayer, displayID: displayID, refreshHz: refreshHz)\n        self.renderer = renderer\n        if options.windowMode == .fullscreen {\n            print("Requesting native AppKit fullscreen on \\(screen.localizedName)...")\n            DispatchQueue.main.async {\n                window.toggleFullScreen(nil)\n            }\n        } else {\n            startRendererIfNeeded()\n        }\n'''
          repl(old_window, new_window)

          p.write_text(s)

          r = Path('tools/macos-metal-latency-probe/README.md')
          text = r.read_text()
          # Repair literal newline escapes introduced by the previous staged README append.
          text = text.replace('\\\\n', '\n')
          text += '''\n\n## Native fullscreen / Direct-to-Display comparison\n\n`--window-mode borderless` preserves the original borderless screen-covering window. `--window-mode fullscreen` uses AppKit native fullscreen via `NSWindow.toggleFullScreen(_:)` and waits for `windowDidEnterFullScreen` before starting either display link, so transition frames are not included in the trace. The requested mode is recorded as `window_mode` in every CSV row.\n\nFor a clean Direct-to-Display comparison keep all layer/presentation settings identical:\n\n```bash\n$BIN --mode metal1 --window-mode borderless --framebuffer-only --vsync --frames 2400 --trace /tmp/borderless_dtd.csv\n$BIN --mode metal1 --window-mode fullscreen --framebuffer-only --vsync --frames 2400 --trace /tmp/fullscreen_dtd.csv\n```\n\nProfile both with Instruments and compare `Direct to Display`, CPU-to-display latency, displayed-surface duration, GPU completion, and GPU-done-to-on-glass/display latency.\n'''
          r.write_text(text)
          PY
      - name: Compile standalone probe
        shell: bash
        run: |
          cd tools/macos-metal-latency-probe
          swift build -c release
      - name: Commit tested source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/macos-metal-latency-probe/Sources/MetalLatencyProbe/main.swift tools/macos-metal-latency-probe/README.md
          git rm .github/workflows/apply-metal-probe-native-fullscreen.yml
          git commit -m 'feat: add native fullscreen mode to Metal latency probe'
          git push
