name: Finalize PSVR2 macOS release and install

on:
  push:
    branches:
      - macos-service-direct-xpc-cadence
    paths:
      - .github/psvr2-finalize-release-install.trigger

permissions:
  contents: write

jobs:
  finalize-and-verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: macos-service-direct-xpc-cadence
          fetch-depth: 0

      - name: Apply narrow release fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          latest = Path('src/xrt/compositor/main/comp_window_macos_latest.m')
          text = latest.read_text()
          old = 'DEBUG_GET_ONCE_BOOL_OPTION(macos_present_stale_substitute, "XRT_MACOS_PRESENT_STALE_SUBSTITUTE", true)'
          new = 'DEBUG_GET_ONCE_BOOL_OPTION(macos_present_stale_substitute, "XRT_MACOS_PRESENT_STALE_SUBSTITUTE", false)'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one stale-substitute true default, found {text.count(old)}')
          latest.write_text(text.replace(old, new, 1))

          renderer = Path('src/xrt/compositor/main/comp_renderer.c')
          text = renderer.read_text()
          feature = 'XRT_FEATURE_MACOS_TIMING_DIAGNOSTICS'

          open_anchor = 'static void\nrenderer_late_render_trace_open(struct comp_renderer *r)'
          wait_anchor = 'static void\nrenderer_late_render_wait(struct comp_renderer *r)'
          frame_anchor = 'static void\nrenderer_late_render_trace_frame(struct comp_renderer *r)'
          renderer_end_anchor = '\n#endif\n\nstatic void\nrenderer_wait_queue_idle(struct comp_renderer *r)'
          for anchor in (open_anchor, wait_anchor, frame_anchor, renderer_end_anchor):
              if text.count(anchor) != 1:
                  raise SystemExit(f'Expected exactly one renderer anchor: {anchor!r}; found {text.count(anchor)}')

          text = text.replace(open_anchor, f'#ifdef {feature}\n{open_anchor}', 1)
          text = text.replace(wait_anchor, f'#endif\n\n{wait_anchor}', 1)
          text = text.replace(frame_anchor, f'#ifdef {feature}\n{frame_anchor}', 1)
          text = text.replace(renderer_end_anchor, f'\n#endif\n{renderer_end_anchor}', 1)
          renderer.write_text(text)

          control = Path('src/xrt/targets/service/macos_xpc_control.m')
          text = control.read_text()
          old = 'bootstrap/unbootout are development registration controls using /tmp'
          new = 'bootstrap/bootout are development registration controls using /tmp'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one usage typo to fix, found {text.count(old)}')
          control.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- src/xrt/compositor/main/comp_window_macos_latest.m src/xrt/compositor/main/comp_renderer.c src/xrt/targets/service/macos_xpc_control.m

      - name: Install build dependencies
        run: brew install cmake eigen glslang libusb ninja molten-vk pkgconf vulkan-headers vulkan-loader

      - name: Configure release-like build
        run: >-
          cmake -S . -B build-release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX="$PWD/stage"
          -DBUILD_TESTING=OFF
          -DXRT_FEATURE_SERVICE=ON
          -DXRT_HAVE_OPENGLES=OFF
          -DXRT_HAVE_SDL2=OFF
          -DXRT_MODULE_MONADO_GUI=OFF
          -DXRT_FEATURE_WINDOW_PEEK=OFF
          -DXRT_FEATURE_DEBUG_GUI=OFF
          -DXRT_FEATURE_CLIENT_DEBUG_GUI=OFF
          -DXRT_BUILD_DRIVER_QWERTY=OFF
          -DXRT_BUILD_DRIVER_PSVR2=ON
          -DXRT_BUILD_DRIVER_PSSENSE=OFF

      - name: Build release-like service/runtime
        run: >-
          cmake --build build-release --parallel
          --target monado-service monado_service_xpc_control openxr_monado

      - name: Verify diagnostics are compiled out
        run: |
          if nm -a build-release/src/xrt/targets/service/monado-service | grep -q 'renderer_late_render_trace_frame'; then
            echo 'diagnostics-only renderer symbol unexpectedly present in release build'
            exit 1
          fi

      - name: Staged install and layout checks
        run: |
          cmake --install build-release
          test -x stage/bin/monado-service
          test -x stage/bin/monado-service-xpc-control
          test -f stage/lib/libopenxr_monado.dylib
          test -f stage/share/openxr/1/openxr_monado.json
          cat stage/share/openxr/1/openxr_monado.json
          if grep -R -E '/Users/|build-release|build-macos|/private/var/folders/' stage/share/openxr stage/bin stage/lib; then
            echo 'staged install contains a build/user-specific path'
            exit 1
          fi
          echo '--- monado-service dependencies ---'
          otool -L stage/bin/monado-service
          echo '--- XPC helper dependencies ---'
          otool -L stage/bin/monado-service-xpc-control
          echo '--- OpenXR runtime dependencies ---'
          otool -L stage/lib/libopenxr_monado.dylib
          echo '--- OpenXR runtime load commands ---'
          otool -l stage/lib/libopenxr_monado.dylib | grep -A3 -E 'LC_ID_DYLIB|LC_RPATH'

      - name: Configure diagnostics-enabled build
        run: >-
          cmake -S . -B build-diagnostics -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DXRT_FEATURE_MACOS_TIMING_DIAGNOSTICS=ON
          -DXRT_FEATURE_SERVICE=ON
          -DXRT_HAVE_OPENGLES=OFF
          -DXRT_HAVE_SDL2=OFF
          -DXRT_MODULE_MONADO_GUI=OFF
          -DXRT_FEATURE_WINDOW_PEEK=OFF
          -DXRT_FEATURE_DEBUG_GUI=OFF
          -DXRT_FEATURE_CLIENT_DEBUG_GUI=OFF
          -DXRT_BUILD_DRIVER_QWERTY=OFF
          -DXRT_BUILD_DRIVER_PSVR2=ON
          -DXRT_BUILD_DRIVER_PSSENSE=OFF

      - name: Build diagnostics-enabled runtime
        run: >-
          cmake --build build-diagnostics --parallel
          --target monado-service monado_service_xpc_control openxr_monado

      - name: Commit verified source fixes
        run: |
          rm -f .github/psvr2-finalize-release-install.trigger
          git add src/xrt/compositor/main/comp_window_macos_latest.m src/xrt/compositor/main/comp_renderer.c src/xrt/targets/service/macos_xpc_control.m
          git add -u .github/psvr2-finalize-release-install.trigger
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'macos: finalize release defaults and install helper'
          git push origin HEAD:macos-service-direct-xpc-cadence
