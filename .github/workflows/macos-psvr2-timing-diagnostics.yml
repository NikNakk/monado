name: macOS PSVR2 timing diagnostics

on:
  push:
    branches:
      - macos-psvr2-timing-diagnostics
      - macos-drawable-slot-newest
      - macos-client-cadence-stabilizer
      - macos-wine-openvr-legacy-unity
      - standards/fb-foveation
    paths:
      - .github/workflows/macos-psvr2-timing-diagnostics.yml
      - CMakeLists.txt
      - tests/tests_psvr2_linear_prediction.c
      - src/xrt/drivers/**
      - src/xrt/compositor/**
      - src/xrt/auxiliary/**
      - src/xrt/targets/**
      - src/xrt/state_trackers/**
      - src/external/openxr_includes/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# This workflow compile-checks the CoreVideo/Metal timing bridge, timeline synchronization, presentation feedback, PSVR2 short- and long-horizon positional predictor diagnostics, and the standalone OpenXR/Metal diagnostic scene used by the diagnostic branch.
jobs:
  build-foveation-standards:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake eigen glslang libusb ninja molten-vk pkgconf vulkan-headers vulkan-loader
      - name: Configure foveation standards build
        run: >-
          cmake -S . -B build-foveation -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DXRT_HAVE_OPENGLES=OFF
          -DXRT_HAVE_SDL2=OFF
          -DXRT_MODULE_MONADO_GUI=OFF
          -DXRT_FEATURE_WINDOW_PEEK=OFF
          -DXRT_FEATURE_DEBUG_GUI=OFF
          -DXRT_FEATURE_CLIENT_DEBUG_GUI=OFF
          -DXRT_BUILD_DRIVER_QWERTY=OFF
          -DXRT_BUILD_DRIVER_PSVR2=ON
          -DXRT_FEATURE_OPENXR_FB_SWAPCHAIN_UPDATE_STATE=ON
          -DXRT_FEATURE_OPENXR_FB_FOVEATION=ON
          -DXRT_FEATURE_OPENXR_FB_FOVEATION_CONFIGURATION=ON
      - name: Build standards targets
        run: >-
          cmake --build build-foveation
          --target st_oxr tests_foveation tests_foveation_openxr psvr2-openxr-test
          --parallel
      - name: Run foveation policy tests
        run: |
          build-foveation/tests/tests_foveation --success
          build-foveation/tests/tests_foveation_openxr --success

  build-driver:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake eigen glslang libusb ninja
      - name: Configure driver-only build
        run: >-
          cmake -S . -B build-driver -G Ninja
          -DBUILD_TESTING=OFF
          -DXRT_FEATURE_OPENXR=OFF
          -DXRT_FEATURE_SERVICE=OFF
          -DXRT_MODULE_COMPOSITOR=OFF
          -DXRT_MODULE_COMPOSITOR_CLIENT=OFF
          -DXRT_MODULE_COMPOSITOR_MAIN=OFF
          -DXRT_MODULE_COMPOSITOR_MULTI=OFF
          -DXRT_MODULE_COMPOSITOR_NULL=OFF
          -DXRT_MODULE_COMPOSITOR_RENDER=OFF
          -DXRT_MODULE_COMPOSITOR_SHADERS=OFF
          -DXRT_MODULE_COMPOSITOR_UTIL=OFF
          -DXRT_MODULE_COMPOSITOR_MOCK=OFF
          -DXRT_MODULE_OPENXR_STATE_TRACKER=OFF
          -DXRT_MODULE_IPC=OFF
          -DXRT_MODULE_MONADO_GUI=OFF
          -DXRT_MODULE_MONADO_CLI=OFF
          -DXRT_FEATURE_WINDOW_PEEK=OFF
          -DXRT_FEATURE_DEBUG_GUI=OFF
          -DXRT_FEATURE_CLIENT_DEBUG_GUI=OFF
          -DXRT_BUILD_DRIVER_PSVR2=ON
          -DXRT_BUILD_DRIVER_PSSENSE=OFF
          -DXRT_BUILD_DRIVER_QWERTY=OFF
          -DXRT_BUILD_DRIVER_SIMULATED=OFF
      - name: Build PSVR2 driver
        run: cmake --build build-driver --target drv_psvr2 --parallel
      - name: Test positional predictor
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -I src/xrt/include -I src/xrt/drivers/psvr2 \
            tests/tests_psvr2_linear_prediction.c -o /tmp/tests_psvr2_linear_prediction
          /tmp/tests_psvr2_linear_prediction


  build-compositor:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake eigen glslang libusb ninja molten-vk pkgconf vulkan-headers vulkan-loader
      - name: Configure compositor build
        run: >-
          cmake -S . -B build-compositor -G Ninja
          -DBUILD_TESTING=OFF
          -DXRT_HAVE_OPENGLES=OFF
          -DXRT_HAVE_SDL2=OFF
          -DXRT_MODULE_MONADO_GUI=OFF
          -DXRT_FEATURE_WINDOW_PEEK=OFF
          -DXRT_FEATURE_DEBUG_GUI=OFF
          -DXRT_FEATURE_CLIENT_DEBUG_GUI=OFF
          -DXRT_BUILD_DRIVER_QWERTY=OFF
          -DXRT_BUILD_DRIVER_PSVR2=ON
          -DXRT_BUILD_DRIVER_PSSENSE=OFF
      - name: Build macOS compositor and OpenXR diagnostic app
        run: cmake --build build-compositor --target comp_main psvr2-openxr-test --parallel
