name: Apply PSVR2 macOS release defaults

on:
  push:
    branches:
      - macos-service-direct-xpc-cadence
    paths:
      - .github/psvr2-apply-release-defaults.trigger

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: macos-service-direct-xpc-cadence
          fetch-depth: 0

      - name: Audit and apply defaults and diagnostic gating
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          ROOT = Path('.')
          SOURCE_SUFFIXES = {'.c', '.h', '.m', '.mm', '.cc', '.cpp'}

          defaults = {
              'XRT_MACOS_ASYNC_PRESENT': 'true',
              'XRT_MACOS_CLIENT_FRAME_DIVISOR': '0',
              'XRT_MACOS_CLIENT_FRAME_MIN_HOLD': '0',
              'XRT_MACOS_COMPOSITOR_QOS': 'true',
              'XRT_MACOS_DEFER_GPU_TIMESTAMPS': 'true',
              'XRT_MACOS_DRAWABLE_SLOT': 'true',
              'XRT_MACOS_EARLY_DRAWABLE': 'false',
              'XRT_MACOS_LATE_RENDER_DESIRED_OFFSET_US': '2000',
              'XRT_MACOS_MAX_DRAWABLES': '3',
              'XRT_MACOS_METAL_SHARED_EVENT_WAIT': 'true',
              'XRT_MACOS_PRESENT_IMMEDIATE': 'false',
              'XRT_MACOS_PRESENT_MIN_DURATION_US': '8000',
              'XRT_MACOS_PRESENT_MIN_LEAD_US': '2000',
              'XRT_MACOS_PRESENT_PRELATCH_US': '2000',
              'XRT_MACOS_PRESENT_STALE_SUBSTITUTE': 'true',
              'XRT_MACOS_PRESENT_WORKER': 'false',
              'XRT_MACOS_SKIP_BLOCKING_GPU_TIMESTAMPS': 'false',
              'PSVR2_ACCELERATION_HORIZON_MS': '90.0f',
              'PSVR2_ACCELERATION_PREDICTION': 'true',
              'PSVR2_CONTINUITY_LIMIT_MM': '7.5f',
              'PSVR2_CONTINUITY_PREDICTION': 'true',
              'PSVR2_CONTINUITY_TAU_MS': '4.0f',
              'PSVR2_FILTERED_LINEAR_PREDICTION': 'false',
              'PSVR2_FULL_LINEAR_HORIZON': 'true',
          }

          source_files = [p for p in (ROOT / 'src' / 'xrt').rglob('*') if p.is_file() and p.suffix in SOURCE_SUFFIXES]
          missing = []
          print('Requested runtime defaults:')
          for env_name, new_default in defaults.items():
              pattern = re.compile(
                  r'(DEBUG_GET_ONCE_(?:BOOL|NUM|FLOAT)_OPTION\(\s*[^,\n]+,\s*"' +
                  re.escape(env_name) + r'"\s*,\s*)([^)\n]+)(\))'
              )
              matches = []
              for path in source_files:
                  text = path.read_text()
                  for m in pattern.finditer(text):
                      matches.append((path, m.group(2).strip()))
              if not matches:
                  missing.append(env_name)
                  print(f'  MISSING macro: {env_name}')
                  continue
              if len(matches) != 1:
                  print(f'  ERROR: {env_name} matched {len(matches)} option declarations: {matches}')
                  sys.exit(2)
              path, old_default = matches[0]
              text = path.read_text()
              updated, count = pattern.subn(lambda m: m.group(1) + new_default + m.group(3), text)
              assert count == 1
              path.write_text(updated)
              print(f'  {env_name}: {old_default} -> {new_default} ({path})')

          # XPC_FLAGS and XPC_SERVICE_NAME were seen in diagnostics, but are not
          # assumed to be tunable environment variables. Report any source use so
          # we do not manufacture configuration that does not exist.
          print('\nXPC diagnostic labels:')
          for token in ('XPC_FLAGS', 'XPC_SERVICE_NAME'):
              hits = []
              for path in ROOT.rglob('*'):
                  if not path.is_file() or '.git' in path.parts:
                      continue
                  try:
                      text = path.read_text()
                  except (UnicodeDecodeError, OSError):
                      continue
                  if token in text:
                      for lineno, line in enumerate(text.splitlines(), 1):
                          if token in line:
                              hits.append(f'{path}:{lineno}: {line.strip()}')
              if hits:
                  print(f'  {token}:')
                  for hit in hits[:20]:
                      print(f'    {hit}')
              else:
                  print(f'  {token}: no repository source occurrence (diagnostic output, not a runtime option)')

          if missing:
              print('\nExact-string context for requested defaults without DEBUG_GET_ONCE declarations:')
              for env_name in missing:
                  print(f'-- {env_name} --')
                  found = False
                  for path in ROOT.rglob('*'):
                      if not path.is_file() or '.git' in path.parts:
                          continue
                      try:
                          lines = path.read_text().splitlines()
                      except (UnicodeDecodeError, OSError):
                          continue
                      for lineno, line in enumerate(lines, 1):
                          if env_name in line:
                              found = True
                              lo = max(0, lineno - 3)
                              hi = min(len(lines), lineno + 2)
                              for n in range(lo, hi):
                                  print(f'{path}:{n+1}: {lines[n]}')
                  if not found:
                      print('  no exact source occurrence')
              print('\nRefusing to commit a partial defaults migration.')
              sys.exit(3)

          # Keep fallback values aligned with the new PSVR2 defaults.
          psvr2_path = ROOT / 'src/xrt/drivers/psvr2/psvr2.c'
          psvr2 = psvr2_path.read_text()
          fallback_replacements = {
              'psvr2_prediction_parameter(debug_get_float_option_psvr2_continuity_limit_mm(), 5.0f, 0.0f, 20.0f)':
                  'psvr2_prediction_parameter(debug_get_float_option_psvr2_continuity_limit_mm(), 7.5f, 0.0f, 20.0f)',
              'psvr2_prediction_parameter(debug_get_float_option_psvr2_acceleration_horizon_ms(), 80.0f, 0.0f, 120.0f)':
                  'psvr2_prediction_parameter(debug_get_float_option_psvr2_acceleration_horizon_ms(), 90.0f, 0.0f, 120.0f)',
          }
          for old, new in fallback_replacements.items():
              if old not in psvr2:
                  raise SystemExit(f'Expected PSVR2 fallback not found: {old}')
              psvr2 = psvr2.replace(old, new, 1)

          # The custom CSV traces are high-frequency diagnostics. Compile their
          # call sites only when explicitly requested; keep real prediction and
          # cadence behaviour available in normal builds.
          timing_opts = (
              'DEBUG_GET_ONCE_BOOL_OPTION(psvr2_timing_trace, "PSVR2_TIMING_TRACE", false)\n'
              'DEBUG_GET_ONCE_BOOL_OPTION(psvr2_driver_timing_trace, "PSVR2_DRIVER_TIMING_TRACE", true)\n'
          )
          if timing_opts not in psvr2:
              raise SystemExit('Expected PSVR2 timing trace option declarations not found')
          psvr2 = psvr2.replace(
              timing_opts,
              '#if defined(XRT_OS_OSX) && defined(XRT_FEATURE_MACOS_TIMING_DIAGNOSTICS)\n' +
              timing_opts +
              '#endif\n',
              1,
          )

          def guard_osx_blocks(text: str, markers):
              lines = text.splitlines(keepends=True)
              starts = []
              i = 0
              while i < len(lines):
                  if lines[i].strip() == '#ifdef XRT_OS_OSX':
                      depth = 1
                      j = i + 1
                      while j < len(lines):
                          stripped = lines[j].lstrip()
                          if stripped.startswith('#if'):
                              depth += 1
                          elif stripped.startswith('#endif'):
                              depth -= 1
                              if depth == 0:
                                  break
                          j += 1
                      if depth != 0:
                          raise SystemExit('Unbalanced XRT_OS_OSX block')
                      body = ''.join(lines[i + 1:j])
                      if any(marker in body for marker in markers):
                          starts.append(i)
                      i = j
                  i += 1
              for idx in starts:
                  lines[idx] = '#if defined(XRT_OS_OSX) && defined(XRT_FEATURE_MACOS_TIMING_DIAGNOSTICS)\n'
              return ''.join(lines), len(starts)

          psvr2, guarded_psvr2 = guard_osx_blocks(
              psvr2,
              ('psvr2_timing_trace_', 'trace_latest_slam_vts_ns'),
          )
          if guarded_psvr2 < 6:
              raise SystemExit(f'Expected at least 6 PSVR2 diagnostic OSX blocks, guarded {guarded_psvr2}')
          psvr2_path.write_text(psvr2)
          print(f'Guarded {guarded_psvr2} PSVR2 high-frequency diagnostic blocks')

          # Renderer late-render waiting is real cadence behaviour and remains in
          # release builds. Remove only diagnostic-only timestamping and CSV calls.
          renderer_path = ROOT / 'src/xrt/compositor/main/comp_renderer.c'
          renderer = renderer_path.read_text()

          for call in (
              'renderer_late_render_trace_open(r);',
              'renderer_late_render_trace_close(r);',
              'renderer_late_render_trace_frame(r);',
          ):
              if renderer.count(call) != 1:
                  raise SystemExit(f'Expected exactly one renderer call site for {call}, found {renderer.count(call)}')
              renderer = renderer.replace(
                  call,
                  '#ifdef XRT_FEATURE_MACOS_TIMING_DIAGNOSTICS\n\t' + call + '\n#endif',
                  1,
              )

          diagnostic_wait_init = (
              '\tr->late_render_target_ns = 0;\n'
              '\tr->late_render_pose_begin_ns = 0;\n'
              '\tr->late_render_pose_end_ns = 0;\n'
              '\tr->late_render_wait_begin_ns = (int64_t)os_monotonic_get_ns();\n'
              '\tr->late_render_wait_end_ns = r->late_render_wait_begin_ns;\n'
          )
          if diagnostic_wait_init not in renderer:
              raise SystemExit('Expected late-render diagnostic wait initialisation block not found')
          renderer = renderer.replace(
              diagnostic_wait_init,
              '#ifdef XRT_FEATURE_MACOS_TIMING_DIAGNOSTICS\n' + diagnostic_wait_init + '#endif\n',
              1,
          )
          if renderer.count('\tr->late_render_target_ns = target_ns;') != 1:
              raise SystemExit('Expected one late_render_target_ns assignment')
          renderer = renderer.replace(
              '\tr->late_render_target_ns = target_ns;',
              '#ifdef XRT_FEATURE_MACOS_TIMING_DIAGNOSTICS\n\tr->late_render_target_ns = target_ns;\n#endif',
              1,
          )
          if renderer.count('\t\t\tr->late_render_wait_end_ns = now_ns;') != 1:
              raise SystemExit('Expected one late_render_wait_end_ns assignment')
          renderer = renderer.replace(
              '\t\t\tr->late_render_wait_end_ns = now_ns;',
              '#ifdef XRT_FEATURE_MACOS_TIMING_DIAGNOSTICS\n\t\t\tr->late_render_wait_end_ns = now_ns;\n#endif',
              1,
          )

          renderer, guarded_renderer = guard_osx_blocks(
              renderer,
              ('late_render_pose_begin_ns =', 'late_render_pose_end_ns ='),
          )
          if guarded_renderer < 3:
              raise SystemExit(f'Expected at least 3 renderer pose-timestamp blocks, guarded {guarded_renderer}')
          renderer_path.write_text(renderer)
          print(f'Guarded {guarded_renderer} renderer diagnostic timestamp blocks')

          # The multi-compositor delivery/QoS wrapper remains active in release;
          # only the per-system-frame CSV latch wrapper is diagnostic-only.
          multi_path = ROOT / 'src/xrt/compositor/multi/comp_multi_system_macos_trace.h'
          multi = multi_path.read_text()
          latch_macro = (
              '#define multi_compositor_latch_frame_locked(mc, when_ns, system_frame_id)                                            \\\n'
              '\tmacos_trace_multi_compositor_latch_frame_locked((mc), (when_ns), (system_frame_id), display_time_ns)\n'
          )
          if latch_macro not in multi:
              raise SystemExit('Expected multi-compositor trace latch macro not found')
          multi = multi.replace(
              latch_macro,
              '#ifdef XRT_FEATURE_MACOS_TIMING_DIAGNOSTICS\n' + latch_macro + '#endif\n',
              1,
          )
          multi_path.write_text(multi)

          # One project-level switch. Directory compile definitions propagate to
          # all src/xrt subdirectories without touching each target CMake file.
          xrt_cmake_path = ROOT / 'src/xrt/CMakeLists.txt'
          xrt_cmake = xrt_cmake_path.read_text()
          cmake_block = '''\
# High-frequency macOS/PSVR2 CSV timing diagnostics are useful during cadence\n# investigations, but they add work to IMU, pose, and compositor hot paths.\noption(\n\tXRT_FEATURE_MACOS_TIMING_DIAGNOSTICS\n\t"Compile high-frequency macOS/PSVR2 timing diagnostics"\n\tOFF\n\t)\nif(XRT_FEATURE_MACOS_TIMING_DIAGNOSTICS)\n\tadd_compile_definitions(XRT_FEATURE_MACOS_TIMING_DIAGNOSTICS)\nendif()\n\n'''
          if 'XRT_FEATURE_MACOS_TIMING_DIAGNOSTICS' not in xrt_cmake:
              marker = '# Order matters.\n'
              if marker not in xrt_cmake:
                  raise SystemExit('Could not find insertion point in src/xrt/CMakeLists.txt')
              xrt_cmake = xrt_cmake.replace(marker, cmake_block + marker, 1)
              xrt_cmake_path.write_text(xrt_cmake)

          # The existing diagnostics workflow should explicitly compile the code
          # that distribution builds now omit from hot paths.
          diag_workflow = ROOT / '.github/workflows/macos-psvr2-timing-diagnostics.yml'
          diag = diag_workflow.read_text()
          configure_markers = (
              '-DBUILD_TESTING=OFF\n',
          )
          # Two configure jobs both contain this line: add the option after each.
          if diag.count('-DBUILD_TESTING=OFF\n') != 2:
              raise SystemExit('Expected two timing-diagnostics CMake configure blocks')
          diag = diag.replace(
              '-DBUILD_TESTING=OFF\n',
              '-DBUILD_TESTING=OFF\n          -DXRT_FEATURE_MACOS_TIMING_DIAGNOSTICS=ON\n',
          )
          diag_workflow.write_text(diag)

          print('\nCompile-time gating added: XRT_FEATURE_MACOS_TIMING_DIAGNOSTICS=OFF by default')
          PY

          git diff --check
          echo '--- resulting diff ---'
          git diff -- . ':!.github/psvr2-apply-release-defaults.trigger'

      - name: Install build dependencies
        run: brew install cmake eigen glslang libusb ninja molten-vk pkgconf vulkan-headers vulkan-loader

      - name: Configure release-like service build
        run: >-
          cmake -S . -B build-release -G Ninja
          -DBUILD_TESTING=OFF
          -DXRT_FEATURE_SERVICE=ON
          -DXRT_HAVE_OPENGLES=OFF
          -DXRT_HAVE_SDL2=OFF
          -DXRT_MODULE_MONADO_GUI=OFF
          -DXRT_FEATURE_WINDOW_PEEK=OFF
          -DXRT_FEATURE_DEBUG_GUI=OFF
          -DXRT_FEATURE_CLIENT_DEBUG_GUI=OFF
          -DXRT_BUILD_DRIVER_QWERTY=OFF
          -DXRT_BUILD_DRIVER_PSVR2=ON
          -DXRT_BUILD_DRIVER_PSSENSE=OFF

      - name: Build release-like service/runtime
        run: >-
          cmake --build build-release --parallel
          --target monado-service monado_service_xpc_control openxr_monado

      - name: Configure diagnostics-enabled build
        run: >-
          cmake -S . -B build-diagnostics -G Ninja
          -DBUILD_TESTING=OFF
          -DXRT_FEATURE_MACOS_TIMING_DIAGNOSTICS=ON
          -DXRT_HAVE_OPENGLES=OFF
          -DXRT_HAVE_SDL2=OFF
          -DXRT_MODULE_MONADO_GUI=OFF
          -DXRT_FEATURE_WINDOW_PEEK=OFF
          -DXRT_FEATURE_DEBUG_GUI=OFF
          -DXRT_FEATURE_CLIENT_DEBUG_GUI=OFF
          -DXRT_BUILD_DRIVER_QWERTY=OFF
          -DXRT_BUILD_DRIVER_PSVR2=ON
          -DXRT_BUILD_DRIVER_PSSENSE=OFF

      - name: Build diagnostics-enabled compositor/driver
        run: cmake --build build-diagnostics --parallel --target comp_main drv_psvr2 openxr_monado

      - name: Commit verified migration
        shell: bash
        run: |
          rm -f .github/psvr2-apply-release-defaults.trigger
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'macos: set proven cadence defaults and gate timing diagnostics'
          git push origin HEAD:macos-service-direct-xpc-cadence
